[package]
name = "aptos-ext"
description = "Extended Aptos tool for code generation from Move modules"
version = "7.10.2"

# Workspace inherited keys
authors = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
repository = { workspace = true }

[dependencies]
anyhow = { workspace = true }
aptos = { workspace = true }
aptos-api-types = { workspace = true }
aptos-framework = { workspace = true }
aptos-move-graphql-scalars = { workspace = true }
aptos-move-graphql-schema = { workspace = true }
async-graphql-reverse = { workspace = true }
async-trait = { workspace = true }
clap = { workspace = true }
move-package = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

# Force exact darling and poem versions to match aptos-core and avoid API incompatibilities
darling = "=0.20.10"
darling_core = "=0.20.10"
darling_macro = "=0.20.10"
poem = "=3.1.3"
poem-openapi = "=5.1.2"
poem-openapi-derive = "=5.1.1"
