[workspace]
members = [
  "crates/aptos-move-graphql-scalars",
  "crates/aptos-move-graphql-schema",
  "crates/aptos-move-graphql-test-helpers",
]
resolver = "2"

[workspace.package]
edition = "2024"
publish = false
authors = ["Daniel Porteous <daniel@dport.me>"]
homepage = "https://dport.me"
license = "Apache-2.0"
repository = "https://github.com/banool/aptos-tools"

[workspace.dependencies]
# Internal dependencies
aptos-move-graphql-scalars = { path = "crates/aptos-move-graphql-scalars" }
aptos-move-graphql-schema = { path = "crates/aptos-move-graphql-schema" }
aptos-move-graphql-test-helpers = { path = "crates/aptos-move-graphql-test-helpers" }

# Regular dependencies
anyhow = "1.0.98"
async-graphql = { version = "6.0.1", features = ["dynamic-schema"] }
clap = { version = "4.3.9", features = [
    "derive",
    "env",
    "unstable-styles",
    "wrap_help",
] }
once_cell = "1.10.0"
serde = { version = "1.0.193", features = ["derive", "rc"] }
serde_json = { version = "1.0.81", features = [
    "preserve_order",
    "arbitrary_precision",
] }

# aptos-core dependencies
aptos-api-types = { git = "https://github.com/aptos-labs/aptos-core.git", rev = "d6e70fb4159dbe606ad5783e3b0ec283eba78c9f" }
move-core-types = { git = "https://github.com/aptos-labs/aptos-core.git", rev = "d6e70fb4159dbe606ad5783e3b0ec283eba78c9f" }

# dev dependencies
aptos-framework = { git = "https://github.com/aptos-labs/aptos-core.git", rev = "d6e70fb4159dbe606ad5783e3b0ec283eba78c9f" }
aptos-types = { git = "https://github.com/aptos-labs/aptos-core.git", rev = "d6e70fb4159dbe606ad5783e3b0ec283eba78c9f" }
move-binary-format = { git = "https://github.com/aptos-labs/aptos-core.git", rev = "d6e70fb4159dbe606ad5783e3b0ec283eba78c9f" }
move-resource-viewer = { git = "https://github.com/aptos-labs/aptos-core.git", rev = "d6e70fb4159dbe606ad5783e3b0ec283eba78c9f" }
tokio = { version = "1.35.1", features = ["full"] }

[patch.crates-io]
merlin = { git = "https://github.com/aptos-labs/merlin" }
